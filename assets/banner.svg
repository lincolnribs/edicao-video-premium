<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="Editor Pro by Lincu">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0B12"/>
      <stop offset="1" stop-color="#1B1030"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF5A36"/>
      <stop offset="1" stop-color="#FF2E88"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="400" fill="url(#bg)"/>
  <!-- linha do tempo -->
  <g opacity="0.18" fill="#FFFFFF">
    <rect x="80" y="330" width="190" height="14" rx="7"/>
    <rect x="282" y="330" width="120" height="14" rx="7"/>
    <rect x="414" y="330" width="260" height="14" rx="7"/>
    <rect x="686" y="330" width="90" height="14" rx="7"/>
    <rect x="788" y="330" width="210" height="14" rx="7"/>
    <rect x="1010" y="330" width="190" height="14" rx="7"/>
  </g>
  <rect x="414" y="330" width="260" height="14" rx="7" fill="url(#acc)"/>
  <rect x="540" y="308" width="4" height="58" rx="2" fill="#FFFFFF"/>
  <!-- quadro 9:16 -->
  <g transform="translate(1060 60)">
    <rect width="120" height="213" rx="16" fill="none" stroke="url(#acc)" stroke-width="4"/>
    <path d="M48 84 L82 106 L48 128 Z" fill="#FFFFFF"/>
  </g>
  <text x="80" y="140" fill="#FFFFFF" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="76" font-weight="800" letter-spacing="-2">Editor Pro</text>
  <text x="80" y="192" fill="url(#acc)" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="40" font-weight="700">by Lincu</text>
  <text x="80" y="246" fill="#E6E3F0" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="600">Brutos entram, Reels profissional sai.</text>
  <text x="80" y="284" fill="#A9A5BA" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="24">Edição de vídeo com o Claude Code, em português.</text>
